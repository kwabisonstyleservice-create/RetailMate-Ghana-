<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102a43">
<title>RetailMate Ghana v0.3.1</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="topbar">
  <div><h1>RetailMate Ghana</h1><p id="business">My Shop</p></div>
  <div><span id="status">Saved locally</span><button onclick="showView('database')">Database</button></div>
</header>

<main>
<section class="metrics">
  <div><span>Sales today</span><strong id="salesToday">GH₵0.00</strong></div>
  <div><span>Expenses</span><strong id="expensesToday">GH₵0.00</strong></div>
  <div><span>Credit owed</span><strong id="creditOwed">GH₵0.00</strong></div>
  <div><span>Est. profit</span><strong id="profitToday">GH₵0.00</strong></div>
</section>

<nav class="actions">
  <button onclick="showView('sell')">SELL</button>
  <button onclick="showView('buy')">I BOUGHT GOODS</button>
  <button onclick="showView('stock')">MY STOCK</button>
  <button onclick="showView('expense')">EXPENSE</button>
  <button onclick="showView('credit')">CUSTOMER OWES ME</button>
  <button onclick="showView('report')">MY BUSINESS</button>
  <button onclick="showView('database')" class="dbbtn">DATABASE MANAGEMENT</button>
</nav>

<section id="view" class="panel"></section>
</main>

<footer>RetailMate Ghana Clean v0.3.1</footer>
<input type="file" id="importFile" accept="application/json" hidden>
<script src="app.js"></script>
</body>
</html>
