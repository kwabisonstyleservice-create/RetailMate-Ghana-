<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102a43"><title>RetailMate Ghana v0.3</title><style>
:root{--navy:#102a43;--blue:#1f5a7a;--green:#2f6b57;--bg:#f5f7f9;--card:#fff;--text:#17202a;--muted:#718096;--line:#e5e9ed;--warn:#b7691e;--danger:#b33c3c}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}.shell{display:flex;min-height:100vh}.sidebar{width:230px;background:var(--navy);color:#fff;padding:20px;position:fixed;inset:0 auto 0 0}.brand{font-weight:900;font-size:20px;margin-bottom:26px}.brand small{display:block;font-size:11px;opacity:.6;font-weight:500}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#dbe7ef;text-align:left;padding:11px 12px;border-radius:10px}.nav button.active,.nav button:hover{background:#ffffff16;color:#fff;font-weight:700}.main{margin-left:230px;width:calc(100% - 230px);padding:28px 34px 60px}.topbar{display:flex;justify-content:space-between;gap:20px;align-items:center}.eyebrow{font-size:11px;font-weight:800;color:var(--blue);letter-spacing:.06em;margin:0 0 4px}.topbar h1{font-size:25px;margin:0}.sub{font-size:13px;color:var(--muted);margin:4px 0 0}.actions{display:flex;gap:8px}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:750;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid var(--line)}.hero{display:grid;grid-template-columns:1.3fr repeat(3,1fr);gap:12px;margin-top:24px}.metric{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.metric span{font-size:11px;color:var(--muted);display:block}.metric strong{font-size:21px;display:block;margin:7px 0 3px}.mainmetric{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;border:0}.mainmetric span,.mainmetric small{color:#dce8f0}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.quick button{background:#fff;border:1px solid var(--line);border-radius:13px;padding:14px;text-align:left;cursor:pointer}.quick b,.quick small{display:block}.quick small{font-size:10px;color:var(--muted);margin-top:3px}.grid{display:grid;grid-template-columns:1.5fr .85fr;gap:14px;margin-top:14px}.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:17px}.panel h3,.card h3{margin-top:0}.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row small{display:block;color:var(--muted);margin-top:2px}.tag{font-size:9px;background:#f7eadc;color:#94551d;padding:4px 7px;border-radius:999px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.form label{font-size:12px;color:#455;display:grid;gap:5px}.form input,.form select{padding:11px;border:1px solid #ccd5dc;border-radius:9px}.span2{grid-column:1/3}.table{width:100%;border-collapse:collapse;font-size:11px}.table th{text-align:left;color:var(--muted);padding:8px 6px;border-bottom:1px solid var(--line)}.table td{padding:10px 6px;border-bottom:1px solid #eef1f3}.empty{text-align:center;color:var(--muted);padding:28px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:13px;padding:13px}.stat small,.stat b{display:block}.stat small{color:var(--muted);font-size:10px}.stat b{margin-top:3px}.mobile{display:none}.notice{background:#eef6f2;color:#315d49;border:1px solid #d7e9df;border-radius:10px;padding:10px;font-size:11px;margin-bottom:12px}@media(max-width:850px){.sidebar{display:none}.main{margin:0;width:100%;padding:18px 14px 80px}.hero{grid-template-columns:1fr 1fr}.mainmetric{grid-column:1/3}.quick{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}.mobile{display:grid;position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);grid-template-columns:repeat(5,1fr);z-index:20}.mobile button{border:0;background:#fff;padding:9px 3px;font-size:10px;color:var(--muted)}.mobile button.active{color:var(--blue);font-weight:700}.actions .secondary{display:none}}@media(max-width:520px){.form{grid-template-columns:1fr}.span2{grid-column:auto}.metric strong{font-size:18px}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand">RetailMate<small>Ghana</small></div><div class="nav" id="nav"><button data-v="dashboard" class="active">Dashboard</button><button data-v="sell">Sell</button><button data-v="products">Products</button><button data-v="purchases">Purchases</button><button data-v="credit">Credit</button><button data-v="expenses">Expenses</button><button data-v="reports">Reports</button><button data-v="settings">Settings</button></div></aside><main class="main"><header class="topbar"><div><p class="eyebrow" id="dateLabel"></p><h1 id="title">Dashboard</h1><p class="sub" id="subtitle">Here is how your shop is doing today.</p></div><div class="actions"><button class="btn secondary" onclick="showProductForm()">+ Add Product</button><button class="btn primary" onclick="go('sell')">New Sale</button></div></header><section id="content"></section></main></div><nav class="mobile"><button data-v="dashboard" class="active">Home</button><button data-v="sell">Sell</button><button data-v="products">Stock</button><button data-v="credit">Credit</button><button data-v="settings">More</button></nav><script>
const KEY='retailmate_v03';const empty={settings:{business:'My Shop',owner:'Owner',low:5},products:[],sales:[],purchases:[],expenses:[],credits:[]};let db=JSON.parse(localStorage.getItem(KEY)||'null')||structuredClone(empty);let view='dashboard';const m=n=>'GH₵ '+Number(n||0).toFixed(2),today=()=>new Date().toISOString().slice(0,10);function save(){localStorage.setItem(KEY,JSON.stringify(db))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()}function totals(){let s=db.sales.filter(x=>x.date===today()),rev=s.reduce((a,x)=>a+x.total,0),cost=s.reduce((a,x)=>a+x.cost,0),exp=db.expenses.filter(x=>x.date===today()).reduce((a,x)=>a+x.amount,0),cash=s.filter(x=>x.pay==='Cash').reduce((a,x)=>a+x.total,0),momo=s.filter(x=>x.pay==='Mobile Money').reduce((a,x)=>a+x.total,0),cr=s.filter(x=>x.pay==='Credit').reduce((a,x)=>a+x.total,0),out=db.credits.filter(x=>!x.paid).reduce((a,x)=>a+x.amount,0);return{s,rev,cost,exp,cash,momo,cr,out,profit:rev-cost-exp}}function low(){return db.products.filter(p=>p.qty<=db.settings.low).sort((a,b)=>a.qty-b.qty)}function go(v){view=v;document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('active',b.dataset.v===v));let map={dashboard:['Dashboard','Here is how your shop is doing today.'],sell:['New Sale','Record what a customer bought.'],products:['Products & Stock','Manage products, prices and stock.'],purchases:['Purchases','Goods bought for your shop.'],credit:['Customer Credit','Track customers who owe you.'],expenses:['Expenses','Record business expenses.'],reports:['Reports','Review your sales and performance.'],settings:['Settings','Business details and preferences.']};title.textContent=map[v][0];subtitle.textContent=map[v][1];render()}function render(){dateLabel.textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase();if(view==='dashboard')dash();if(view==='sell')sell();if(view==='products')products();if(view==='purchases')purchases();if(view==='credit')credit();if(view==='expenses')expenses();if(view==='reports')reports();if(view==='settings')settings()}function salesTable(rows){return rows.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Item</th><th>Payment</th><th>Amount</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${x.date}</td><td>${esc(x.product)} × ${x.qty}</td><td>${x.pay}</td><td>${m(x.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No sales yet.</div>'}function dash(){let t=totals(),l=low();content.innerHTML=`<div class="hero"><div class="metric mainmetric"><span>Sales today</span><strong>${m(t.rev)}</strong><small>${t.s.length} transaction(s)</small></div><div class="metric"><span>Estimated profit</span><strong>${m(t.profit)}</strong><small>Sales − cost − expenses</small></div><div class="metric"><span>Customer credit</span><strong>${m(t.out)}</strong><small>${db.credits.filter(x=>!x.paid).length} unpaid</small></div><div class="metric"><span>Low stock</span><strong>${l.length} items</strong><small>At or below ${db.settings.low}</small></div></div><div class="quick"><button onclick="go('sell')"><b>Record Sale</b><small>Cash, MoMo or credit</small></button><button onclick="showProductForm()"><b>I Bought Goods</b><small>Add or restock items</small></button><button onclick="showExpenseForm()"><b>Add Expense</b><small>Transport, utilities, etc.</small></button><button onclick="go('credit')"><b>Customer Credit</b><small>Track money owed</small></button></div><div class="grid"><div class="panel"><h3>Today's money</h3><div class="row"><span>Cash</span><b>${m(t.cash)}</b></div><div class="row"><span>Mobile Money</span><b>${m(t.momo)}</b></div><div class="row"><span>Credit sales</span><b>${m(t.cr)}</b></div><div class="row"><span>Expenses</span><b>${m(t.exp)}</b></div></div><div class="panel"><h3>Stock alerts</h3>${l.length?l.slice(0,5).map(p=>`<div class="row"><div><b>${esc(p.name)}</b><small>${p.qty} left</small></div><span class="tag">Low</span></div>`).join(''):'<div class="empty">No low-stock items.</div>'}</div></div><div class="grid"><div class="panel"><h3>Recent sales</h3>${salesTable(db.sales.slice().reverse().slice(0,6))}</div><div class="panel"><h3>Customers owing you</h3>${db.credits.filter(x=>!x.paid).length?db.credits.filter(x=>!x.paid).slice(0,5).map(c=>`<div class="row"><div><b>${esc(c.customer)}</b><small>${esc(c.product)}</small></div><b>${m(c.amount)}</b></div>`).join(''):'<div class="empty">No unpaid credit.</div>'}</div></div>`}function sell(){if(!db.products.length){content.innerHTML='<div class="card" style="margin-top:22px"><div class="empty"><b>Add a product first.</b><br><br><button class="btn primary" onclick="showProductForm()">Add Product</button></div></div>';return}content.innerHTML=`<div class="card" style="margin-top:22px"><div class="notice">Sales are saved on this device immediately, even if the internet is unavailable.</div><form class="form" id="saleForm"><label>Product<select id="sp">${db.products.map(p=>`<option value="${p.id}">${esc(p.name)} — ${p.qty} in stock</option>`).join('')}</select></label><label>Quantity<input id="sq" type="number" min="1" value="1"></label><label>Payment<select id="pay"><option>Cash</option><option>Mobile Money</option><option>Credit</option></select></label><label>Customer name<input id="cust" placeholder="Required for credit"></label><div class="span2"><button class="btn primary">Record Sale</button></div></form></div>`;saleForm.onsubmit=e=>{e.preventDefault();let p=db.products.find(x=>x.id===sp.value),q=+sq.value;if(!p||q<1)return alert('Enter a valid quantity.');if(q>p.qty)return alert(`Only ${p.qty} in stock.`);if(pay.value==='Credit'&&!cust.value.trim())return alert('Enter customer name.');let total=q*p.sellPrice;db.sales.push({id:id(),date:today(),product:p.name,qty:q,total,cost:q*p.costPrice,pay:pay.value});p.qty-=q;if(pay.value==='Credit')db.credits.push({id:id(),date:today(),customer:cust.value.trim(),product:p.name,amount:total,paid:false});save();go('dashboard')}}function products(){content.innerHTML=`<div class="stats"><div class="stat"><small>Products</small><b>${db.products.length}</b></div><div class="stat"><small>Total units</small><b>${db.products.reduce((a,p)=>a+p.qty,0)}</b></div><div class="stat"><small>Low stock</small><b>${low().length}</b></div><div class="stat"><small>Stock at cost</small><b>${m(db.products.reduce((a,p)=>a+p.qty*p.costPrice,0))}</b></div></div><div class="card" style="margin-top:14px"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Products</h3><button class="btn primary" onclick="showProductForm()">+ Add / Restock</button></div>${db.products.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Product</th><th>Qty</th><th>Cost</th><th>Selling</th></tr></thead><tbody>${db.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.qty}</td><td>${m(p.costPrice)}</td><td>${m(p.sellPrice)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No products yet.</div>'}</div>`}function purchases(){content.innerHTML=`<div class="card" style="margin-top:22px"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Purchase history</h3><button class="btn primary" onclick="showProductForm()">Record Purchase</button></div>${db.purchases.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Product</th><th>Qty</th><th>Total</th></tr></thead><tbody>${db.purchases.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>${m(x.total)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No purchases yet.</div>'}</div>`}function credit(){let o=db.credits.filter(x=>!x.paid);content.innerHTML=`<div class="stats"><div class="stat"><small>Outstanding</small><b>${m(o.reduce((a,x)=>a+x.amount,0))}</b></div><div class="stat"><small>Open records</small><b>${o.length}</b></div></div><div class="card" style="margin-top:14px"><h3>Outstanding credit</h3>${o.length?o.map(c=>`<div class="row"><div><b>${esc(c.customer)}</b><small>${esc(c.product)} · ${c.date}</small></div><div><b>${m(c.amount)}</b> <button class="btn secondary" onclick="markPaid('${c.id}')">Mark paid</button></div></div>`).join(''):'<div class="empty">No unpaid credit.</div>'}</div>`}function expenses(){content.innerHTML=`<div class="card" style="margin-top:22px"><div style="display:flex;justify-content:space-between;align-items:center"><h3>Expenses</h3><button class="btn primary" onclick="showExpenseForm()">+ Add Expense</button></div>${db.expenses.length?`<div style="overflow:auto"><table class="table"><thead><tr><th>Date</th><th>Description</th><th>Amount</th></tr></thead><tbody>${db.expenses.slice().reverse().map(x=>`<tr><td>${x.date}</td><td>${esc(x.description)}</td><td>${m(x.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No expenses yet.</div>'}</div>`}function reports(){let t=totals();content.innerHTML=`<div class="stats"><div class="stat"><small>Today sales</small><b>${m(t.rev)}</b></div><div class="stat"><small>Today expenses</small><b>${m(t.exp)}</b></div><div class="stat"><small>Today profit</small><b>${m(t.profit)}</b></div><div class="stat"><small>Outstanding credit</small><b>${m(t.out)}</b></div></div><div class="card" style="margin-top:14px"><h3>Sales transactions</h3>${salesTable(db.sales.slice().reverse())}</div>`}function settings(){content.innerHTML=`<div class="card" style="margin-top:22px"><h3>Business settings</h3><form class="form" id="settingsForm"><label>Business name<input id="bus" value="${esc(db.settings.business)}"></label><label>Owner name<input id="own" value="${esc(db.settings.owner)}"></label><label>Low stock warning<input id="lw" type="number" min="0" value="${db.settings.low}"></label><div class="span2"><button class="btn primary">Save Settings</button></div></form><p class="sub" style="margin-top:16px">Version 0.3 stores data only on this device. Cloud backup comes later.</p></div>`;settingsForm.onsubmit=e=>{e.preventDefault();db.settings.business=bus.value.trim()||'My Shop';db.settings.owner=own.value.trim()||'Owner';db.settings.low=Math.max(0,+lw.value||0);save();go('dashboard')}}function showProductForm(){content.innerHTML=`<div class="card" style="margin-top:22px"><h3>Add / Restock Product</h3><form class="form" id="prodForm"><label class="span2">Product name<input id="pn" placeholder="e.g. Geisha Soap"></label><label>Quantity bought<input id="pq" type="number" min="1" value="1"></label><label>Cost per item<input id="pc" type="number" min="0" step=".01"></label><label>Selling price<input id="ps" type="number" min="0" step=".01"></label><div class="span2"><button class="btn primary">Save Product</button></div></form></div>`;title.textContent='Add / Restock Product';subtitle.textContent='Record goods bought for the shop.';prodForm.onsubmit=e=>{e.preventDefault();let name=pn.value.trim(),q=+pq.value,c=+pc.value,s=+ps.value;if(!name||q<1)return alert('Complete the product details.');let p=db.products.find(x=>x.name.toLowerCase()===name.toLowerCase());if(p){p.qty+=q;p.costPrice=c;p.sellPrice=s}else db.products.push({id:id(),name,qty:q,costPrice:c,sellPrice:s});db.purchases.push({id:id(),date:today(),product:name,qty:q,total:q*c});save();go('products')}}function showExpenseForm(){content.innerHTML=`<div class="card" style="margin-top:22px"><h3>Add Expense</h3><form class="form" id="expForm"><label class="span2">Description<input id="ed" placeholder="e.g. Transport"></label><label>Amount<input id="ea" type="number" min=".01" step=".01"></label><div class="span2"><button class="btn primary">Record Expense</button></div></form></div>`;title.textContent='Add Expense';subtitle.textContent='Record a business cost.';expForm.onsubmit=e=>{e.preventDefault();let a=+ea.value;if(a<=0)return alert('Enter an amount.');db.expenses.push({id:id(),date:today(),description:ed.value.trim()||'Expense',amount:a});save();go('expenses')}}function markPaid(i){let c=db.credits.find(x=>x.id===i);if(c){c.paid=true;save();credit()}}document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>go(b.dataset.v));go('dashboard');
</script></body></html>
