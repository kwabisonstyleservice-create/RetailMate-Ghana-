<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#15324b">
<title>RetailMate Ghana</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header><div><h1>RetailMate Ghana</h1><p>My Shop</p></div><span id="net">Checking...</span></header>
<main>
<section class="summary">
<div><small>Sales today</small><b id="sales">GH₵0.00</b></div>
<div><small>Expenses</small><b id="expenses">GH₵0.00</b></div>
<div><small>Credit owed</small><b id="credit">GH₵0.00</b></div>
<div><small>Est. profit</small><b id="profit">GH₵0.00</b></div>
</section>

<section class="buttons">
<button onclick="show('sell')">SELL</button>
<button onclick="show('buy')">I BOUGHT GOODS</button>
<button onclick="show('stock')">MY STOCK</button>
<button onclick="show('expense')">EXPENSE</button>
<button onclick="show('credit')">CUSTOMER OWES ME</button>
<button onclick="show('report')">MY BUSINESS</button>
</section>

<section id="view"></section>
</main>
<footer>Offline-first retail notebook · Version 0.1</footer>
<script src="app.js"></script>
</body>
</html>
